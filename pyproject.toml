[project]
name = "boring-data-converter"
version = "0.1.0"
description = "ボーリング柱状図 XML(ボーリング交換用データ)を深度区間ごとの NDJSON / GeoJSON に変換する"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["lxml"]

[project.optional-dependencies]
# scripts/ の DPP 一括取得用
fetch = ["requests"]
dev = ["pytest"]
# scripts/build_release.py(GeoParquet の作成。#42)
release = ["geopandas", "pyarrow", "pyogrio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boring_converter"]

[project.scripts]
boring-convert = "boring_converter.cli:main"
